<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PropertyFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <div>
        <h1>PropertyFinder</h1>
        <p class="subtitle">Property search &amp; insurance estimates</p>
      </div>
    </div>
    <div class="actions">
      <button id="statusBtn" class="status" type="button" title="Connection settings">
        <span class="dot" id="statusDot"></span><span id="statusText">Not connected</span>
      </button>
      <button id="newChatBtn" class="ghost" type="button">New chat</button>
    </div>
  </header>

  <section id="connPanel" class="panel" hidden>
    <form id="connForm">
      <label>Agent URL
        <input id="agentUrl" type="url" required placeholder="http://localhost:8000" autocomplete="off">
      </label>
      <label>API key <span class="hint">(if the server requires one)</span>
        <input id="apiKey" type="password" placeholder="optional" autocomplete="off">
      </label>
      <div class="row">
        <button type="submit" class="primary">Connect</button>
        <button type="button" id="resetConn" class="ghost" title="Use the AGENT_URL configured on the UI server">Use default</button>
        <button type="button" id="closePanel" class="ghost">Close</button>
      </div>
    </form>
    <div id="connInfo" class="conn-info"></div>
  </section>

  <main id="chat" class="chat" aria-live="polite">
    <div id="empty" class="empty">
      <h2>Find a place. Know what it costs to insure.</h2>
      <p>Ask about rentals, homes for sale, or commercial spaces, and get premium estimates across coverage tiers.</p>
      <div class="suggestions">
        <button type="button" class="chip">Find 2-bedroom apartments for rent in San Francisco under $4,000</button>
        <button type="button" class="chip">Quote insurance for a $450k house in Austin, TX 78701, 2,000 sqft</button>
        <button type="button" class="chip">Compare insurance for a $600k single-family home across CA, TX, FL and CO</button>
        <button type="button" class="chip">What insurance add-ons are recommended for a rental in Florida?</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <form id="chatForm">
      <textarea id="input" rows="1" placeholder="Ask about properties or insurance…" required></textarea>
      <button id="sendBtn" type="submit" class="primary" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5l0 6.6L15 12 3 13.9z"/></svg>
      </button>
    </form>
    <p class="disclaimer">Insurance figures are estimates, not binding offers.</p>
  </footer>
</body>
</html>
